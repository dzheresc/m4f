# cpplint (https://github.com/cpplint/cpplint) settings for this chapter.
# Run from ch01/cpp:  cpplint --recursive include src tests
set noparent
linelength=80
# No per-file copyright banners in this repo.
filter=-legal/copyright
# Guards are M4F_CH01_<FILE>_H_, matching namespace m4f::ch01, so that headers
# with the same name in other chapters never clash.
filter=-build/header_guard
# The project targets C++20; <optional>, <format> etc. are fine.
filter=-build/c++11,-build/c++17
# Headers live under include/m4f/ and are included as "m4f/<file>.h".
filter=-build/include_subdir
