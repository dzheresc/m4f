# Python tooling for chapter 1, following the Google Python style guide
# (https://google.github.io/styleguide/pyguide.html).

# Pyink is Google's fork of Black; the style guide recommends it.
#   pip install pyink && pyink python/
[tool.pyink]
line-length = 80
pyink-indentation = 4
pyink-use-majority-quotes = true
preview = true
unstable = false
